<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline | Cynatra</title>
    <style>
      :root { color-scheme: dark light; --bg: #0b0a10; --fg: #f6f5fa; --muted: #a09cb3; --accent: #ff5a5f; }
      @media (prefers-color-scheme: light) { :root { --bg: #f6f5fa; --fg: #17151f; --muted: #6b6780; --accent: #dc3d43; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
             background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 24px; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 8px 0 28px; color: var(--muted); }
      button { border: 0; border-radius: 12px; padding: 12px 22px; background: var(--accent); color: #fff;
               font: 600 16px system-ui, -apple-system, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="16" fill="#FF5A5F" />
        <circle cx="24" cy="20" r="7" fill="#FFF8F2" /><circle cx="24" cy="44" r="7" fill="#FFF8F2" /><circle cx="46" cy="32" r="7" fill="#FFF8F2" />
      </svg>
      <h1>You're offline</h1>
      <p>Cynatra needs a connection to find something to watch. Check your Wi-Fi or data, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
