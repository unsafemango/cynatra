# Builds the web, gateway and picker images for ARM (the Oracle server) and
# Intel, and pushes them to ghcr.io/<owner>/cynatra-<service> as `latest` and
# `sha-<commit>`. Runs on every push to main, or by hand from the Actions tab.
name: Images

on:
  push:
    branches: [main]
    paths: ["web/**", "gateway/**", "picker/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, gateway, picker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cynatra-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Web: empty API URL, so the browser calls /api on the same domain.
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
