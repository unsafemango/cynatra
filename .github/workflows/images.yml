# Builds the web, gateway and picker images for ARM (the Oracle server) and
# Intel, and pushes them to ghcr.io/<owner>/cynatra-<service> as `latest` and
# `sha-<commit>`. Runs on every push to main, or by hand from the Actions tab.
#
# Each platform builds natively on its own runner (GitHub's free ARM runners
# for arm64): emulating ARM with QEMU was slow and crashed the Next.js build
# ("qemu: uncaught target signal 4"). The merge job then joins the two
# per-platform images into one multi-arch tag, and the deploy job restarts the
# app on the server so it pulls them.
name: Images

on:
  push:
    branches: [main]
    paths: ["web/**", "gateway/**", "picker/**", "k8s/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        service: [web, gateway, picker]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          # Pushed by digest only; the merge job gives them their tags.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/cynatra-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          # Web: empty API URL, so the browser calls /api on the same domain.
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
      - name: Save the image digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [web, gateway, picker]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cynatra-${{ matrix.service }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Check both platforms are there
        run: docker buildx imagetools inspect "$IMAGE:latest"

  # Deploys this commit: to staging straight away, then to production once
  # approved (the "production" environment requires a reviewer). The deploy key
  # can only run /usr/local/bin/cynatra-deploy on the server (forced command in
  # its authorized_keys): "deploy <staging|prod> <commit>" fetches that commit's
  # k8s/ overlay from GitHub, pins the images to sha-<commit> and applies it.
  deploy-staging:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: staging, url: "https://staging.cynatra.app" }
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4 # for .github/scripts/deploy.sh
      - name: Deploy to staging
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: .github/scripts/deploy.sh staging "$GITHUB_SHA"

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: production, url: "https://cynatra.app" }
    # A newer release replaces an older one still waiting for approval, so only
    # the latest ever asks (and approving can't deploy an outdated commit).
    # Without this, a waiting release held the slot and newer ones queued
    # behind it. A deploy already running takes seconds; one cut short by a
    # newer approved release is simply superseded by it.
    concurrency: { group: deploy-production, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4 # for .github/scripts/deploy.sh
      - name: Deploy to production
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: .github/scripts/deploy.sh prod "$GITHUB_SHA"

  # Every production deploy becomes a GitHub Release (e.g. v2026.10.20-57),
  # with notes listing the pull requests it contains since the last one.
  release:
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-$GITHUB_RUN_NUMBER"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
