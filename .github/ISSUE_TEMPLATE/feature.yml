name: Feature idea
description: Something Cynatra could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: Who is it for, and what are they trying to do? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: The idea }
  - type: textarea
    id: notes
    attributes: { label: Anything else, description: "Mock-ups, examples from other apps, how it could make money…" }
