# Full stack: the Next.js web app, Node gateway, Go picker, Postgres, Redis
# and Mailpit (local email inbox). `docker compose up --build` runs it all;
# the app is on http://localhost:3000. For frontend development with hot
# reload, run `npm run dev` in web/ instead and skip the web service
# (`docker compose up -d gateway`), since both use port 3000.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cynatra
      POSTGRES_PASSWORD: cynatra
      POSTGRES_DB: cynatra
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cynatra"]
      interval: 3s
      retries: 20

  # Local email catcher: sign-up codes land in the inbox at http://localhost:8025
  # instead of being delivered. Point SMTP_URL at a real provider in production.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  picker:
    build: ./picker
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in .env}
      REDIS_URL: redis://redis:6379/0
      PORT: "8081"
    ports: ["8081:8081"]
    depends_on: [redis]

  gateway:
    build: ./gateway
    environment:
      PORT: "4000"
      PICKER_URL: http://picker:8081
      DATABASE_URL: postgres://cynatra:cynatra@postgres:5432/cynatra
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Real email: set SMTP_HOST/PORT/USER/PASS in .env (they take priority).
      # Otherwise codes go to the local Mailpit inbox at http://localhost:8025.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-Cynatra <no-reply@cynatra.local>}
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      picker: { condition: service_started }
      mailpit: { condition: service_started }

  web:
    build:
      context: ./web
      args:
        # Baked into the browser bundle: the gateway URL as the *browser* sees it.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      gateway: { condition: service_started }

volumes:
  pgdata:
