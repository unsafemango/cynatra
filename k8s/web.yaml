# Next.js server. Its image is built with an empty API URL, so the browser
# calls /api on the same domain (routed to the gateway by the Ingress).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: cynatra-web
          # Unprivileged, read-only and with no extra Linux capabilities: little to
          # gain from breaking into this container.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          env:
            # Server-rendered pages (titles, people, the sitemap) call the gateway
            # inside the cluster rather than going out and back in through the domain.
            - { name: SERVER_API_URL, value: "http://gateway:4000" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
          # The filesystem is read-only; Next.js writes its image cache (and
          # temporary files) here instead.
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: next-cache
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
