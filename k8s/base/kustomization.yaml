# The app itself, shared by both environments (k8s/overlays/staging and
# k8s/overlays/prod add the namespace, address and environment-only pieces).
# Deploys normally come from GitHub Actions (DEPLOY.md, "Staging and production").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster-issuer.yaml
  - postgres.yaml
  - redis.yaml
  - picker.yaml
  - gateway.yaml
  - web.yaml
  - network-policies.yaml
  - redirect-https.yaml

# Images built by GitHub Actions. Deploys pin them to the exact commit
# (sha-<commit>); `latest` is only for applying by hand.
images:
  - name: cynatra-web
    newName: ghcr.io/unsafemango/cynatra-web
    newTag: latest
  - name: cynatra-gateway
    newName: ghcr.io/unsafemango/cynatra-gateway
    newTag: latest
  - name: cynatra-picker
    newName: ghcr.io/unsafemango/cynatra-picker
    newTag: latest
