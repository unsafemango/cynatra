# Cynatra on k3s. Deploy with:  kubectl apply -k k8s/
# The secret `cynatra-secrets` must exist first (DEPLOY.md, step 7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cynatra

resources:
  - namespace.yaml
  - cluster-issuer.yaml
  - postgres.yaml
  - redis.yaml
  - picker.yaml
  - gateway.yaml
  - web.yaml
  - ingress.yaml

# Non-secret settings. The domain also appears in ingress.yaml.
configMapGenerator:
  - name: cynatra-config
    literals:
      - CORS_ORIGIN=https://cynatra.app,https://www.cynatra.app

# Images built by GitHub Actions. Pin a tag (e.g. sha-abc1234) instead of
# latest for reproducible deploys.
images:
  - name: cynatra-web
    newName: ghcr.io/unsafemango/cynatra-web
    newTag: latest
  - name: cynatra-gateway
    newName: ghcr.io/unsafemango/cynatra-gateway
    newTag: latest
  - name: cynatra-picker
    newName: ghcr.io/unsafemango/cynatra-picker
    newTag: latest
