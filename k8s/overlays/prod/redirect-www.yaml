# www.cynatra.app → cynatra.app (permanent), so search engines see one site,
# not two copies of every page.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
spec:
  redirectRegex:
    regex: ^https?://www\.cynatra\.app/(.*)
    replacement: https://cynatra.app/${1}
    permanent: true
