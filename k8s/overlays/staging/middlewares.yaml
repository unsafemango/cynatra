# Staging is for checking changes before they go live, not for the public.

# A username and password before any page loads. The users live in the
# `staging-basic-auth` secret (created on the server, never in git): see
# DEPLOY.md, "Staging and production".
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
spec:
  basicAuth:
    secret: staging-basic-auth
    realm: Cynatra staging
---
# Tell search engines to stay away (it's a copy of the real site).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
